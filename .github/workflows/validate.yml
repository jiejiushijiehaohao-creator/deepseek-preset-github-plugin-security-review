name: validate

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preset:
    name: Validate bundle + preset patch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the YAML parser used by the validator
        run: npm install --no-save --no-audit --no-fund js-yaml@^4

      - name: Validate manifest, patch resolution and preset structure
        run: node scripts/validate.mjs
